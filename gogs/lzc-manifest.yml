# 当前部署的 Gogs 版本：0.14.3
# 官方镜像：gogs/gogs:0.14.3（legacy 镜像，digest sha256:3c7dbdf05a64471296eddf510312589aa8f478c795387993fabcf5d54c68e5cd）
# 懒猫镜像：registry.lazycat.cloud/ety001/gogs/gogs:094efd9e0191abd5
application:
  subdomain: gogs
  background_task: true
  multi_instance: false
  ingress:
    - protocol: tcp
      port: 22
      service: gogs
    - protocol: tcp
      description: MySQL
      port: 3306
      service: mysql
  routes:
    - /=http://gogs.ink.akawa.ety001.gogs.lzcapp:3000
services:
  mysql:
    image: registry.lazycat.cloud/mysql
    binds:
      - /lzcapp/var/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=gogs
      - MYSQL_USER=gogs
      - MYSQL_PASSWORD=123456
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -hlocalhost -ugogs -p123456
      start_period: 180s
      disable: false
  gogs:
    # Gogs 0.14.3，由 lzc-cli appstore copy-image gogs/gogs:0.14.3 同步
    image: registry.lazycat.cloud/ety001/gogs/gogs:094efd9e0191abd5
    depends_on:
      - mysql
    environment:
      - TZ=Asia/Shanghai
      - RUN_CROND=1
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/crontabs/periodic:/etc/periodic
    setup_script: |
      if [ ! -d "/data/gogs/log" ]; then
        mkdir -p /data/gogs/log && chmod 777 /data/gogs/log
      fi
