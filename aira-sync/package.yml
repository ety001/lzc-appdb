package: ink.akawa.ety001.aira-sync
version: 0.4.4
name: Aira Sync
description: Aira 浏览器私有化同步服务器（based on Aira Personal Server）。同步书签、历史记录、个性化设置与小说书架，支持网页接力与跨设备标签页。
author: ETY001
homepage: https://github.com/mason173/aira-browser
license: https://github.com/mason173/aira-browser/blob/main/services/personal-server/LICENSE
# 不再使用 run_as（权限在镜像 entrypoint 内处理），min_os_version 回落到
# lzc-sdk v2 格式所需的 1.5.0，1.5.x / 1.6.x 盒子均可安装。
min_os_version: "1.5.0"
locales:
  zh:
    name: Aira 同步服务器
    description: Aira 浏览器私有化同步服务器（based on Aira Personal Server）。同步书签、历史记录、个性化设置与小说书架，支持网页接力与跨设备标签页。
  zh_CN:
    name: Aira 同步服务器
    description: Aira 浏览器私有化同步服务器（based on Aira Personal Server）。同步书签、历史记录、个性化设置与小说书架，支持网页接力与跨设备标签页。
  en:
    name: Aira Sync
    description: Self-hosted sync server for Aira Browser (based on Aira Personal Server). Syncs bookmarks, history, personalization and novel bookshelf; supports Page Push and cross-device tabs.
