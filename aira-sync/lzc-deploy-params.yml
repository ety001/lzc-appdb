params:
  - id: public_url
    type: string
    name: "对外公开地址（可选）"
    description: "仅当通过自己的 HTTPS 反向代理对外暴露时填写，如 https://sync.example.com；留空即可正常在懒猫内使用"
    default_value: ""
    optional: true
  - id: admin_token
    type: secret
    name: "管理界面令牌"
    description: "登录 Web 管理界面（/admin）用的令牌，必填。请使用足够长的强随机串（如 24 位以上），安装后用它登录管理界面"
