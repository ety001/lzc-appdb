application:
  subdomain: aira-sync
  # 同步服务器需要常驻，避免每次轮询冷启动
  background_task: true
  # Aira 自带完整鉴权（一次性配对码 + 每设备 Bearer 令牌，服务端只存 SHA-256 哈希）。
  # 手机 App / 浏览器扩展的请求无法携带懒猫网关登录态，必须关闭网关鉴权让应用自己认证。
  # 未认证端点只有 /health、/.well-known/aira 和需要有效配对码的 /v1/pairing/exchange。
  # /admin 管理界面保留网关鉴权（! 排除语法优先级最高），再加管理令牌，双重校验。
  # （domain_prefix 前缀域名方案已废弃：API-token/CLI 身份在网关鉴权下的 <prefix>-<subdomain>
  #  域名上会 404 "Unable to retrieve corresponding service information"。）
  public_path:
    - /
    - !/admin/*
    - !/admin
  # 直连入口（可选备用）：http://aira-sync.<box>.heiyu.space:8787
  # 四层转发绕过网关，无网关请求体限制；同样只在懒猫虚拟网络内可达，由 Aira 自身鉴权保护。
  # （admin 界面不在此入口上，只走网关域名。）
  ingress:
    - protocol: tcp
      description: Aira Personal Server direct HTTP
      port: 8787
      service: aira-server
  # 全部流量先进 Go sidecar：/admin* 由它直接服务，其余反代到 Node 同步服务。
  # （upstreams 的 location 路径分流实测只有精确匹配生效，子路径不可靠，故在容器内分流）
  routes:
    - /=http://aira-admin.ink.akawa.ety001.aira-sync.lzcapp:8080

services:
  aira-server:
    # 权限处理已移入镜像 entrypoint（root 启动 → chown /data → setpriv 降权到 UID 1000）。
    # 不再用 run_as：其 idmapped 挂载机制在部分盒子（lzcwlf01, lzcos 1.6.2）上
    # EOVERFLOW 失败（mkdir .../idmapped/...: value too large for defined data type）。
    # 源码: https://github.com/mason173/aira-browser services/personal-server @ f6fcbc6
    # 构建: docker/Dockerfile (上游 + entrypoint.sh 降权 + AIRA_HOST=0.0.0.0)
    image: registry.lazycat.cloud/ety001/ety001/aira-personal-server:ac1212441e1d9650
    binds:
      - /lzcapp/var/data:/data
    environment:
      - AIRA_HOST=0.0.0.0
      - AIRA_PORT=8787
      - AIRA_DATA_DIR=/data
      # 不设 AIRA_PUBLIC_URL（留空）：各设备以自己填写的地址为准（手机端忽略 discovery 的
      # baseUrl，扩展端空值时回退到用户输入地址），网关域名和直连两种填法都兼容。
      # 旧版本的 public_url 部署参数已从引导页移除；确需经自有 HTTPS 反代对外暴露时，
      # 用 /lzcapp/var/data 下的自定义环境方式或在 manifest 这里按需填写。

  aira-admin:
    # Go 管理界面（配对码展示/签发、设备管理）。源码: vendor/aira-sync-admin
    # 与 aira-server 共享 /data（读 SQLite + 写 pairing_codes/devices.revoked_at，
    # WAL 模式下跨进程读写安全，busy_timeout 5s）。同样 entrypoint 降权到 UID 1000，不用 run_as。
    image: registry.lazycat.cloud/ety001/ety001/aira-personal-server:fbd0de4bd245fdb2
    depends_on:
      - aira-server
    binds:
      - /lzcapp/var/data:/data
    environment:
      - AIRA_ADMIN_LISTEN=0.0.0.0:8080
      - AIRA_ADMIN_DB=/data/aira-personal-server.db
      - AIRA_ADMIN_SETUP_CODE=/data/setup-code
      - AIRA_ADMIN_UPSTREAM=http://aira-server:8787
      # 登录管理界面用的令牌；必填部署参数（懒猫引导页强制填写）。注意：懒猫模板引擎不支持
      # sprig 的 required/default 管道（"function required not defined"），必填保证由
      # deploy-params 的 optional 缺省 + lpk-manager 的 need-setup-deploy-params 拦截兜底，
      # sidecar 内再对空值/<no value> fail-fast。
      - AIRA_ADMIN_TOKEN={{ .U.admin_token }}
