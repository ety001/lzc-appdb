ext_config:
  enable_media_access: true
application:
  subdomain: multitune
  multi_instance: false
  background_task: true
  routes:
    - /=http://multitune:8080
services:
  multitune:
    image: registry.lazycat.cloud/ety001/ety001/multitune:f1621528f09459ff
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/cache/thumbnails:/app/cache/thumbnails
    environment:
      - DATA_PATH=/app/data
      - CACHE_PATH=/app/cache/thumbnails
      - PORT=8080
      - LAZYCAT_DEPLOY=true
